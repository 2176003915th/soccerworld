<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Load More Button with Thymeleaf</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>게시물 목록</h1>
<div id="postContainer">
  <div th:replace="fragments/game-list :: postList"></div>
</div>

<button id="loadMoreBtn" onclick="loadMorePosts()" style="display:block; margin:20px auto; padding:10px 20px;">더 보기</button>

<script>
  let lastId = null;
  let lastDate = null;
  function loadMorePosts() {
    $("#loadMoreBtn").text("로딩 중...");

    $.get("/posts", { lastDate: lastDate}, function (data) {
      $("#postContainer").append(data);
      lastDate = parseInt($("#postContainer div:last").attr("data-id")) + 1;
      alert(lastDate);

      if (!lastDate) {
        $("#loadMoreBtn").hide(); // 더 이상 데이터가 없으면 버튼 숨김
      } else {
        $("#loadMoreBtn").text("더 보기");
      }
    });
  }
</script>

</body>
</html>
